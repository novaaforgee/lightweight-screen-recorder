name: Build and Release APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build Debug & Release APK
      run: ./gradlew assembleDebug --stacktrace

    - name: Prepare APK Asset
      run: |
        mkdir -p release-out
        cp app/build/outputs/apk/debug/app-debug.apk release-out/LiteScreenRecorder-v1.0.0.apk

    - name: Upload Build Artifact
      uses: actions/upload-artifact@v4
      with:
        name: LiteScreenRecorder-v1.0.0-APK
        path: release-out/LiteScreenRecorder-v1.0.0.apk

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v1.0.0
        name: "Release v1.0.0 - Lightweight Screen Recorder"
        body: |
          ### Release Notes
          - Native Kotlin Screen Recorder for Android.
          - Zero ads, no watermarks, low battery overhead.
          - Download the APK directly from the assets below and install on any Android 7.0+ device.
        files: release-out/LiteScreenRecorder-v1.0.0.apk
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
