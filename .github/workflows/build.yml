name: Build and Release APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build Debug & Release APK
      run: ./gradlew assembleDebug --stacktrace

    - name: Prepare APK Asset
      run: |
        mkdir -p release-out
        cp app/build/outputs/apk/debug/app-debug.apk release-out/LiteScreenRecorder-Pro-v1.1.0.apk

    - name: Upload Build Artifact
      uses: actions/upload-artifact@v4
      with:
        name: LiteScreenRecorder-Pro-v1.1.0-APK
        path: release-out/LiteScreenRecorder-Pro-v1.1.0.apk

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v1.1.0
        name: "Release v1.1.0 - Floating Controls & In-App Vault"
        body: |
          ### What's New in v1.1.0:
          - **Floating Overlay Bubble:** Draggable on-screen widget to Pause, Resume, and Stop recording on the fly.
          - **In-App Vault Storage:** Recordings are saved securely inside the app by default (no direct clutter in public phone gallery).
          - **Multi-Select & Bulk Export:** Select All / individual checkboxes to Export to Phone Gallery, Share via WhatsApp/Apps, or Delete in bulk.
        files: release-out/LiteScreenRecorder-Pro-v1.1.0.apk
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
